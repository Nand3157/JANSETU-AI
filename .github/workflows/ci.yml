name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint • Typecheck • Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci can fail if lock is out of sync (common after manual edits) — fall back to npm install
      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync env (safe)
        run: node scripts/sync-env.mjs || echo "no root .env — CI will use defaults"

      - name: Typecheck API
        run: npx tsc --noEmit --project services/api/tsconfig.json

      - name: Typecheck Web
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Build API
        run: npm run build --workspace=services/api

      - name: Build Web
        run: npm run build --workspace=apps/web
        env:
          # Use dummy public env for CI build — real values come from Vercel dashboard in prod
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: https://jansetu-ai-web-sooty.vercel.app
          NEXT_PUBLIC_FIREBASE_CONFIG: '{"apiKey":"AIza-ci-dummy","authDomain":"dummy.firebaseapp.com","projectId":"dummy"}'
          NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: AIza-ci-dummy-key
          SKIP_SEED: "true"
