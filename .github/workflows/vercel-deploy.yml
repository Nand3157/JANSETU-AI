name: Vercel Auto Deploy

# Auto-deploy JANSETU AI to Vercel on every push to main
# - Web (Next.js) deploys to Vercel (apps/web)
# - API (Express) builds & typechecks; deploy to Vercel/Cloud Run as configured
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN        → vercel.com → Settings → Tokens → Create (Scope: your team)
#   VERCEL_ORG_ID       → .vercel/project.json → orgId  (or `vercel link` then cat)
#   VERCEL_PROJECT_ID   → .vercel/project.json → projectId (web project)
# Optional for API if deployed to Vercel separately:
#   VERCEL_API_PROJECT_ID

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync env (safe split)
        run: node scripts/sync-env.mjs || echo "no root .env — using CI env"

      - name: Typecheck API
        run: npx tsc --noEmit --project services/api/tsconfig.json

      - name: Typecheck Web
        run: npx tsc --noEmit --project apps/web/tsconfig.json

      - name: Build shared package
        run: npm run build --workspace=packages/shared --if-present || echo "shared build skip"

      - name: Build API
        run: npm run build --workspace=services/api

      # Web build is verified via Vercel's own build, but we preflight here to catch errors early
      # Use dummy public env for CI — real values are injected via Vercel dashboard
      - name: Build Web (preflight)
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_SITE_URL: https://jansetu-ai-web-sooty.vercel.app
          NEXT_PUBLIC_FIREBASE_CONFIG: '{"apiKey":"AIza-ci-dummy","authDomain":"dummy.firebaseapp.com","projectId":"dummy"}'
          NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: AIza-ci-dummy-key
          SKIP_SEED: "true"

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    # Only run if Vercel secrets are configured — otherwise skip gracefully (native Vercel Git integration handles deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        continue-on-error: false
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Comment deployment URL
        if: success()
        run: echo "✅ Web deployed to Vercel production via auto-deploy workflow"

  deploy-web-skip-notice:
    name: Deploy Web skipped (native Vercel)
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.VERCEL_TOKEN == '' || secrets.VERCEL_ORG_ID == '' || secrets.VERCEL_PROJECT_ID == '')
    steps:
      - run: echo "ℹ️ Vercel deploy skipped — no VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets. Native Vercel Git integration will auto-deploy apps/web. To enable workflow deploy, add secrets in GitHub → Settings → Secrets → Actions."

  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Preview to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-preview-skip:
    name: Deploy Preview skipped (native Vercel)
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    if: github.event_name == 'pull_request' && (secrets.VERCEL_TOKEN == '' || secrets.VERCEL_ORG_ID == '' || secrets.VERCEL_PROJECT_ID == '')
    steps:
      - run: echo "ℹ️ Preview deploy skipped — no Vercel secrets. Create a Preview via Vercel's native GitHub PR integration."

  deploy-api-vercel:
    name: Deploy API to Vercel (optional)
    runs-on: ubuntu-latest
    needs: build-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_API_TO_VERCEL == 'true' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_API_PROJECT_ID != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./services/api
